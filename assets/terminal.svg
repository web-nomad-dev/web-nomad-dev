<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="100%" height="410" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f242c" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13.5px;
        line-height: 22px;
      }
      .prompt { fill: #38bdf8; font-weight: 600; }
      .path { fill: #a855f7; font-weight: 600; }
      .cmd { fill: #f1f5f9; font-weight: 500; }
      .str { fill: #34d399; }
      .key { fill: #38bdf8; }
      .val { fill: #facc15; }
      .bracket { fill: #94a3b8; }
      .comment { fill: #64748b; font-style: italic; }
      .info { fill: #94a3b8; }
      .success { fill: #4ade80; font-weight: 600; }
      .cursor {
        fill: #38bdf8;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Shadow & Body -->
  <rect width="860" height="410" rx="12" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Window Titlebar -->
  <path d="M0,12 C0,5.37 5.37,0 12,0 L848,0 C854.63,0 860,5.37 860,12 L860,38 L0,38 Z" fill="url(#headerBg)" />
  <line x1="0" y1="38" x2="860" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls (macOS Dots) -->
  <circle cx="22" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="42" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="62" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Title Text -->
  <text x="430" y="24" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5" font-weight="500">
    zsh — huzaif@cloud-node: ~/workspace (ProcessFlow)
  </text>

  <!-- Terminal Content Lines -->
  <g class="mono" transform="translate(26, 68)">
    
    <!-- Command 1: whoami -->
    <text y="0">
      <tspan class="prompt">web-nomad</tspan><tspan fill="#64748b">@</tspan><tspan class="path">cloud-node</tspan><tspan fill="#94a3b8">:~$</tspan>
      <tspan class="cmd"> whoami</tspan>
    </text>
    <text y="24">
      <tspan class="info">➜  </tspan>
      <tspan class="str">Mohammad Huzaif Khot</tspan>
      <tspan class="comment"> // Full-Stack Architect &amp; Distributed Systems Specialist</tspan>
    </text>

    <!-- Command 2: cat stack.json -->
    <text y="64">
      <tspan class="prompt">web-nomad</tspan><tspan fill="#64748b">@</tspan><tspan class="path">cloud-node</tspan><tspan fill="#94a3b8">:~$</tspan>
      <tspan class="cmd"> cat core_stack.json</tspan>
    </text>
    <text y="88">
      <tspan class="bracket">{</tspan>
    </text>
    <text y="110">
      <tspan dx="18" class="key">"backend"</tspan><tspan class="bracket">: </tspan><tspan class="bracket">[</tspan><tspan class="val">".NET 10"</tspan><tspan class="bracket">, </tspan><tspan class="val">"MediatR"</tspan><tspan class="bracket">, </tspan><tspan class="val">"EF Core"</tspan><tspan class="bracket">, </tspan><tspan class="val">"PostgreSQL"</tspan><tspan class="bracket">],</tspan>
    </text>
    <text y="132">
      <tspan dx="18" class="key">"frontend"</tspan><tspan class="bracket">: </tspan><tspan class="bracket">[</tspan><tspan class="val">"React 18"</tspan><tspan class="bracket">, </tspan><tspan class="val">"TypeScript"</tspan><tspan class="bracket">, </tspan><tspan class="val">"Tailwind CSS"</tspan><tspan class="bracket">, </tspan><tspan class="val">"Vite"</tspan><tspan class="bracket">],</tspan>
    </text>
    <text y="154">
      <tspan dx="18" class="key">"patterns"</tspan><tspan class="bracket">: </tspan><tspan class="bracket">[</tspan><tspan class="val">"Clean Architecture"</tspan><tspan class="bracket">, </tspan><tspan class="val">"CQRS"</tspan><tspan class="bracket">, </tspan><tspan class="val">"4-Eye Security"</tspan><tspan class="bracket">],</tspan>
    </text>
    <text y="176">
      <tspan dx="18" class="key">"cloud"</tspan><tspan class="bracket">: </tspan><tspan class="bracket">[</tspan><tspan class="val">"Microsoft Azure"</tspan><tspan class="bracket">, </tspan><tspan class="val">"Docker"</tspan><tspan class="bracket">, </tspan><tspan class="val">"GitHub Actions"</tspan><tspan class="bracket">]</tspan>
    </text>
    <text y="198">
      <tspan class="bracket">}</tspan>
    </text>

    <!-- Command 3: git status -->
    <text y="238">
      <tspan class="prompt">web-nomad</tspan><tspan fill="#64748b">@</tspan><tspan class="path">cloud-node</tspan><tspan fill="#94a3b8">:~$</tspan>
      <tspan class="cmd"> git status --short</tspan>
    </text>
    <text y="262">
      <tspan class="success">✔</tspan>
      <tspan class="info"> On branch </tspan><tspan class="path">main</tspan>
      <tspan class="comment"> — 0 vulnerabilities, 100% type-safety, clean builds</tspan>
    </text>

    <!-- Active Prompt with Blinking Cursor -->
    <text y="302">
      <tspan class="prompt">web-nomad</tspan><tspan fill="#64748b">@</tspan><tspan class="path">cloud-node</tspan><tspan fill="#94a3b8">:~$</tspan>
      <tspan class="cmd"> </tspan><tspan class="cursor">█</tspan>
    </text>

  </g>
</svg>
